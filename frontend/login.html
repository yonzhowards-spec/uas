<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Food Ordering</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(135deg,#ff7b42,#ffb36a);

    font-family:Segoe UI;

}

.login-box{

    width:380px;

    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:0 15px 40px rgba(0,0,0,.2);

}

.login-box h1{

    text-align:center;

    color:#ff6b35;

    margin-bottom:10px;

}

.login-box p{

    text-align:center;

    color:#777;

    margin-bottom:30px;

}

.login-box input{

    width:100%;

    padding:14px;

    margin-bottom:18px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:16px;

    box-sizing:border-box;

}

.login-box button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#ff6b35;

    color:white;

    font-size:17px;

    cursor:pointer;

}

.login-box button:hover{

    background:#d35400;

}

</style>

</head>

<body>

<div class="login-box">

<h1>🍽 Food Ordering</h1>

<p>Silakan Login</p>

<input
type="email"
id="email"
placeholder="Masukkan Email">

<input
type="password"
id="password"
placeholder="Masukkan Password">

<button onclick="login()">

Login

</button>

</div>

<script src="js/login.js"></script>

</body>

</html>
